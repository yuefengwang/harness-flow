[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "notes"
version = "0.1.0"
description = "CLI note manager with tags and search"
requires-python = ">=3.9"

[project.scripts]
notes = "notes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harness Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Top Status Bar -->
  <header class="status-bar">
    <div class="status-bar-inner">
      <div class="status-bar-left">
        <h1 class="logo">Harness</h1>
        <span class="logo-sub">Dashboard</span>
      </div>
      <div class="status-bar-center">
        <div class="stat-card" id="stat-agents">
          <span class="stat-label">Agents</span>
          <span class="stat-value" id="stat-total">--</span>
        </div>
        <div class="stat-card stat-running" id="stat-running">
          <span class="stat-label">Running</span>
          <span class="stat-value" id="stat-running-count">--</span>
          <span class="stat-dot" id="status-indicator"></span>
        </div>
        <div class="stat-card" id="stat-projects">
          <span class="stat-label">Projects</span>
          <span class="stat-value" id="stat-projects-count">--</span>
        </div>
        <div class="stat-card" id="stat-branch">
          <span class="stat-label">Base</span>
          <span class="stat-value" id="stat-base-branch">--</span>
        </div>
      </div>
      <div class="status-bar-right">
        <div class="credential-indicator" id="credential-indicator" title="Credential status">
          <span class="credential-icon" id="credential-icon">●</span>
          <div class="credential-tooltip" id="credential-tooltip"></div>
        </div>
        <button class="btn btn-primary" id="btn-new-task">+ New Task</button>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="layout">
    <!-- Agent List -->
    <section class="agent-list-section" id="agent-list-section">
      <!-- Filter Bar -->
      <div class="filter-bar" id="filter-bar">
        <div class="filter-bar-inner">
          <div class="filter-search">
            <input type="text" class="filter-input" id="filter-search" placeholder="Search by task name..." autocomplete="off">
          </div>
          <div class="filter-dropdowns">
            <select class="filter-select" id="filter-project">
              <option value="">All Projects</option>
            </select>
            <select class="filter-select" id="filter-type">
              <option value="">All Types</option>
              <option value="claude">Claude</option>
              <option value="gemini">Gemini</option>
              <option value="opencode">OpenCode</option>
            </select>
            <select class="filter-select" id="filter-status">
              <option value="">All Status</option>
              <option value="running">Running</option>
              <option value="stopped">Stopped</option>
            </select>
          </div>
          <div class="filter-actions">
            <span class="filter-count" id="filter-count"></span>
            <button class="btn btn-secondary btn-sm" id="filter-clear" style="display:none">Clear</button>
          </div>
        </div>
      </div>
      <div class="section-header">
        <h2 class="section-title">Active Agents</h2>
        <div class="section-actions">
          <span class="refresh-indicator" id="refresh-indicator" title="Auto-refreshing every 5s">◉</span>
          <span class="agent-count-badge" id="agent-count-badge">0</span>
        </div>
      </div>
      <div class="agent-list" id="agent-list">
        <!-- Agent cards rendered by JS -->
      </div>
      <!-- No results -->
      <div class="filter-no-results" id="filter-no-results">
        <span class="filter-no-results-text">No agents match your filters</span>
        <button class="btn btn-secondary btn-sm" id="btn-no-results-clear">Clear Filters</button>
      </div>
      <!-- Empty state -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">◉</div>
        <h3 class="empty-title">No Active Agents</h3>
        <p class="empty-desc">No worktree tasks are currently running. Dispatch your first task to get started.</p>
        <button class="btn btn-primary" id="btn-empty-dispatch">+ Dispatch Task</button>
      </div>
      <!-- Loading state -->
      <div class="loading-state" id="loading-state">
        <div class="loading-spinner"></div>
        <span>Loading agents...</span>
      </div>
    </section>

    <!-- Detail Panel (right side) -->
    <aside class="detail-panel" id="detail-panel">
      <div class="detail-header">
        <h3 class="detail-title">Agent Detail</h3>
        <button class="btn-icon" id="btn-close-detail" title="Close panel">▲</button>
      </div>
      <div class="detail-body" id="detail-body">
        <!-- Rendered by JS -->
      </div>
    </aside>
  </main>

  <!-- New Task Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="new-task-modal">
      <div class="modal-header">
        <h3 class="modal-title">Dispatch New Task</h3>
        <button class="btn-icon" id="btn-close-modal" title="Close">▲</button>
      </div>
      <form id="dispatch-form" class="modal-body">
        <div class="form-group">
          <label class="form-label" for="task-project">Project</label>
          <select class="form-select" id="task-project" required>
            <option value="">-- Select project --</option>
          </select>
          <span class="form-error" id="error-project"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="task-name">Task Name</label>
          <input class="form-input" type="text" id="task-name" placeholder="e.g. add-auth" required minlength="3" autocomplete="off">
          <span class="form-error" id="error-task-name"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="task-agent">Agent</label>
          <select class="form-select" id="task-agent">
            <option value="claude">Claude</option>
            <option value="gemini">Gemini</option>
            <option value="opencode">OpenCode</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group form-group-inline">
            <label class="form-label" for="task-base-branch">Base Branch</label>
            <input class="form-input" type="text" id="task-base-branch" value="dev" autocomplete="off">
          </div>
          <div class="form-group form-group-inline">
            <label class="form-label">Docker</label>
            <label class="toggle">
              <input type="checkbox" id="task-docker">
              <span class="toggle-track"></span>
              <span class="toggle-label">Isolate in container</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="toggle">
            <input type="checkbox" id="task-launch" checked>
            <span class="toggle-track"></span>
            <span class="toggle-label">Auto-launch agent after dispatch</span>
          </label>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel-dispatch">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-dispatch">Dispatch</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="/static/app.js"></script>
</body>
</html>

harness:
  # 阶段边界：true = 阶段跑完自动推进（含自动勾 Gate / 判定 Route）；
  # false = 每个阶段等用户输入 /advance。可用 ./sw init --auto / --manual 临时覆写。
  auto_advance: false
  # 阶段内部：true = 连 Agent 的结构化提问也自动代答（取推荐项）。
  # 与 auto_advance 正交 —— 默认 false，提问始终交还用户决策。
  # 无人值守跑批时用 ./sw init --unattended 临时开启。
  auto_answer: false
  # 等真人回答 agent 提问（question / ask_user）的上限，单位秒。
  # 默认 1800（30 分钟）：提问弹在 TUI 里，人可能切窗口或离开工位，
  # 而超时的后果不是「慢」而是决策被替换 —— harness 会让 agent 自行决定。
  # 这段等待**不计入**空闲判据，所以调大它不会让真死锁更晚暴露
  # （那由 transport.IDLE_TIMEOUT 的 5 分钟负责）。
  ask_user_timeout: 1800
  repo_path: repo
  coding:
    # Red 见证（A2）。false = 03 阶段不拆子状态，走原有的 run_project_tests，
    # 行为与引入见证之前完全一致；.state 里的 red_witness 字段被忽略但不删除。
    red_witness: true
  docker:
    enabled: false
    image_prefix: sw-agent
    mount_git_config: true
    mount_ssh: true
  mock_agent:
    enabled: false
    response_delay: 2.0
    review_route: "02-Planning"
    responses:
      01-brainstorming: "## \U0001F916 AI Output\n\n### \u6B67\u4E49\u5206\u6790\u7ED3\
        \u679C\n- **\u7406\u89E3\u51C6\u786E\u5EA6**: \u9700\u6C42\u6E05\u6670\uFF0C\
        \u65E0\u91CD\u5927\u6B67\u4E49\n- **\u5173\u952E\u5047\u8BBE**:\n  - \u5047\
        \u8BBE\u7528\u6237\u5E0C\u671B\u4FDD\u6301\u5411\u540E\u517C\u5BB9\n  - \u5047\
        \u8BBE\u90E8\u7F72\u73AF\u5883\u4E3A\u6807\u51C6 Linux \u670D\u52A1\u5668\n\
        \n### \u8BBE\u8BA1\u65B9\u6848\n\u65B9\u6848 A: \u6700\u5C0F\u5316\u4FEE\u6539\
        \ \u2014 \u5728\u73B0\u6709\u67B6\u6784\u4E0A\u589E\u91CF\u5B9E\u73B0\n\n\
        **\u7ED3\u8BBA**: \u91C7\u7528\u65B9\u6848 A\uFF0C\u8BC4\u5BA1\u901A\u8FC7\
        \u540E\u53EF\u8FDB\u5165\u89C4\u5212\u9636\u6BB5\u3002\n\n## Gate\n- [x] Design\
        \ approved\n- [x] Ready for Planning\n"
  roles:
    adversary:
      agent: opencode
      description: "\u53CD\u4F8B\u5BFC\u5411\u5BA1\u67E5\u8005\uFF1A\u53EA\u63D0\u4EA4\
        \u53EF\u6267\u884C\u7684\u53CD\u4F8B\uFF0C\u4E0D\u5199\u8BC4\u8BED"
      # 与 developer 的 mimo、design_critic 的 hy 都不同厂商 ——
      # C2 要的是「审查者与作者盲区不重合」，同厂商不同版本不算异构。
      # ⚠️ 模型是实测挑出来的：账号下 16 个候选 free 模型只有 3 个能真的
      # 调通（mimo-v2.5-free / big-pickle / hy3-free），其余全部 HTTP 500。
      # 换模型前请先用 OpenCodeAgent 实测能否返回文本，别只看模型列表。
      model: opencode/big-pickle
      tools:
      - list_files
      - read_file
      - ask_user
    analyst:
      agent: opencode
      description: "\u9700\u6C42\u5206\u6790\u5E08\uFF1A\u64C5\u957F\u5F15\u5BFC\u3001\
        \u6F84\u6E05\u548C\u957F\u6587\u672C\u7406\u89E3"
      model: opencode/mimo-v2.5-free
      tools:
      - list_files
      - read_file
      - write_file
      - ask_user
    architect:
      agent: opencode
      description: "\u7CFB\u7EDF\u67B6\u6784\u5E08\uFF1A\u64C5\u957F\u6A21\u5757\u62C6\
        \u89E3\u548C\u63A5\u53E3\u8BBE\u8BA1"
      model: opencode/mimo-v2.5-free
      tools:
      - list_files
      - read_file
      - write_file
      - ask_user
    archivist:
      agent: opencode
      description: "\u6587\u6863\u4E13\u5458\uFF1A\u8D1F\u8D23\u5F52\u6863\u548C\u6587\
        \u6863\u6574\u7406"
      model: opencode/mimo-v2.5-free
      tools:
      - list_files
      - read_file
      - write_file
      - ask_user
    developer:
      agent: opencode
      description: "\u4EE3\u7801\u6267\u884C\u8005\uFF1A\u5168\u9762\u5F00\u653E\u4EE3\
        \u7801\u8BFB\u5199\u548C\u7EC8\u7AEF\u6267\u884C\u6743\u9650"
      model: opencode/mimo-v2.5-free
      tools:
      - list_files
      - read_file
      - write_file
      - run_command
      - ask_user
    design_critic:
      agent: opencode
      description: "\u8BBE\u8BA1\u5BA1\u67E5\u8005\uFF1A\u53EA\u8BFB\uFF0C\u53EA\u770B\
        \u8BBE\u8BA1\u8D28\u91CF\u4E0E\u9700\u6C42\u7B26\u5408\u5EA6"
      # 第三个厂商：developer=mimo、adversary=big-pickle、design_critic=hy。
      model: opencode/hy3-free
      tools:
      - list_files
      - read_file
    reviewer:
      agent: opencode
      description: "\u4EE3\u7801\u8BC4\u5BA1\u5458\uFF1A\u5FEB\u901F\u3001\u4E25\u82DB\
        \u7684\u903B\u8F91\u68C0\u67E5"
      model: opencode/mimo-v2.5-free
      # write_file 是**用户拍板**加的（任务 qqqq 的死锁）：O6 要求
      # repo/<task>/README.md 存在且非空，而 04 原先没有写权限、03 的 prompt
      # 又不提 README —— 要求在 04 兑现、能力只在 03 存在，于是两次 /advance
      # 输出逐字相同，没有任何角色能修。详见 A0 的 2.9.11。
      #
      # 与「审查者不修改被审对象」的张力由硬层边界兜住：判据区（.state /
      # facts/ / STATUS.json / .evidence_key）仍然 deny，reviewer 改不了
      # Gate、red_witness 与 claims。守护判据见
      # tests/unit/workflow/test_review_readme_deadlock.py。
      #
      # ⚠️ 这**不**适用于 design_critic（A8 的 3.6 纯只读）—— 那是主观轨
      # 审查者，与 04 的单角色回落 reviewer 是两个角色。
      tools:
      - list_files
      - read_file
      - write_file
      - run_command
      - ask_user
  stage_roles:
    01-brainstorming: analyst
    02-planning: architect
    03-coding: developer
    04-review: reviewer
    05-archive: archivist
  # 04 阶段的审查编排（A4 的 3.2）。stage_roles 的 04-review 保留为单角色回落。
  review:
    objective:
      # 客观轨：纯程序判定，无 LLM。实现属 A6，此处只声明意图。
      enabled: true
    # 主观轨审查者。**仍然故意留空**，但原因已随 A5 落地而改变：
    #
    # A5 已把 fan-out / fan-in 建好并实测通过 —— 填两个角色确实会真的跑起
    # 两个审查者、各自落到 04-review.<role>.md，产出不再互相覆盖。
    # 但 fan-in 之后的**仲裁器属 A9，尚未实现**：实测填上两个审查者后
    # StageOutput.route 为 None、gate_passed 为 False，TUI 会卡在 04 阶段
    # 推不动（A5 的 11.1）。
    #
    # 所以现在填上去的后果不是「声称两个只跑一个」，而是「两个都跑了但没人
    # 下结论」。A9 落地后把下面两行取消注释即可，无需改 Python：
    #   - {role: adversary, model: opencode/mimo-v2.5-free, kind: counterexample}
    #   - {role: design_critic, model: opencode/mimo-v2.5-free, kind: design_review}
    # tests/unit/workflow/test_review_arbiter_contract.py 会守住这个前置条件。
    subjective: []
    # 并发上限（A5 的 3.5）。多个 LLM 同时打同一 provider 会撞限流，
    # 而限流失败若被记成「审查者无发现」，故障就变成了放行理由。
    max_parallel: 3
    # 已开启（2026-08-24）。作者与两个审查者分属三个模型族：
    # developer=mimo、adversary=big-pickle、design_critic=hy。
    #
    # 开启的前提是两件事都已办到：
    #   1. provider 改为识别模型族而非网关名 —— 否则 opencode 网关下所有
    #      模型都是同一个 provider，异构永远开不起来。
    #   2. 三个模型都实测能真的调通（见
    #      tests/unit/core/test_reviewer_heterogeneity_live.py 的实测清单）。
    #
    # ⚠️ 强度声明：模型族只是廉价代理指标，不是先验独立性的证明（A4 的 U4-3）。
    # 不同厂商若共享训练数据，盲区仍可能重合。真正的证明只能来自 A11 的变异探针。
    require_heterogeneous: true
  worktree_dir: .worktrees

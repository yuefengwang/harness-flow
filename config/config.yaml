harness:
  # 阶段边界：true = 阶段跑完自动推进（含自动勾 Gate / 判定 Route）；
  # false = 每个阶段等用户输入 /advance。可用 ./sw init --auto / --manual 临时覆写。
  auto_advance: false
  # 阶段内部：true = 连 Agent 的结构化提问也自动代答（取推荐项）。
  # 与 auto_advance 正交 —— 默认 false，提问始终交还用户决策。
  # 无人值守跑批时用 ./sw init --unattended 临时开启。
  auto_answer: false
  repo_path: repo
  coding:
    # Red 见证（A2）。false = 03 阶段不拆子状态，走原有的 run_project_tests，
    # 行为与引入见证之前完全一致；.state 里的 red_witness 字段被忽略但不删除。
    red_witness: true
  docker:
    enabled: false
    image_prefix: sw-agent
    mount_git_config: true
    mount_ssh: true
  mock_agent:
    enabled: false
    response_delay: 2.0
    review_route: "02-Planning"
    responses:
      01-brainstorming: "## \U0001F916 AI Output\n\n### \u6B67\u4E49\u5206\u6790\u7ED3\
        \u679C\n- **\u7406\u89E3\u51C6\u786E\u5EA6**: \u9700\u6C42\u6E05\u6670\uFF0C\
        \u65E0\u91CD\u5927\u6B67\u4E49\n- **\u5173\u952E\u5047\u8BBE**:\n  - \u5047\
        \u8BBE\u7528\u6237\u5E0C\u671B\u4FDD\u6301\u5411\u540E\u517C\u5BB9\n  - \u5047\
        \u8BBE\u90E8\u7F72\u73AF\u5883\u4E3A\u6807\u51C6 Linux \u670D\u52A1\u5668\n\
        \n### \u8BBE\u8BA1\u65B9\u6848\n\u65B9\u6848 A: \u6700\u5C0F\u5316\u4FEE\u6539\
        \ \u2014 \u5728\u73B0\u6709\u67B6\u6784\u4E0A\u589E\u91CF\u5B9E\u73B0\n\n\
        **\u7ED3\u8BBA**: \u91C7\u7528\u65B9\u6848 A\uFF0C\u8BC4\u5BA1\u901A\u8FC7\
        \u540E\u53EF\u8FDB\u5165\u89C4\u5212\u9636\u6BB5\u3002\n\n## Gate\n- [x] Design\
        \ approved\n- [x] Ready for Planning\n"
  roles:
    adversary:
      agent: opencode
      description: "\u53CD\u4F8B\u5BFC\u5411\u5BA1\u67E5\u8005\uFF1A\u53EA\u63D0\u4EA4\
        \u53EF\u6267\u884C\u7684\u53CD\u4F8B\uFF0C\u4E0D\u5199\u8BC4\u8BED"
      model: opencode/mimo-v2.5-free
      tools:
      - list_files
      - read_file
      - ask_user
    analyst:
      agent: opencode
      description: "\u9700\u6C42\u5206\u6790\u5E08\uFF1A\u64C5\u957F\u5F15\u5BFC\u3001\
        \u6F84\u6E05\u548C\u957F\u6587\u672C\u7406\u89E3"
      model: opencode/mimo-v2.5-free
      tools:
      - list_files
      - read_file
      - write_file
      - ask_user
    architect:
      agent: opencode
      description: "\u7CFB\u7EDF\u67B6\u6784\u5E08\uFF1A\u64C5\u957F\u6A21\u5757\u62C6\
        \u89E3\u548C\u63A5\u53E3\u8BBE\u8BA1"
      model: opencode/mimo-v2.5-free
      tools:
      - list_files
      - read_file
      - write_file
      - ask_user
    archivist:
      agent: opencode
      description: "\u6587\u6863\u4E13\u5458\uFF1A\u8D1F\u8D23\u5F52\u6863\u548C\u6587\
        \u6863\u6574\u7406"
      model: opencode/mimo-v2.5-free
      tools:
      - list_files
      - read_file
      - write_file
      - ask_user
    developer:
      agent: opencode
      description: "\u4EE3\u7801\u6267\u884C\u8005\uFF1A\u5168\u9762\u5F00\u653E\u4EE3\
        \u7801\u8BFB\u5199\u548C\u7EC8\u7AEF\u6267\u884C\u6743\u9650"
      model: opencode/mimo-v2.5-free
      tools:
      - list_files
      - read_file
      - write_file
      - run_command
      - ask_user
    design_critic:
      agent: opencode
      description: "\u8BBE\u8BA1\u5BA1\u67E5\u8005\uFF1A\u53EA\u8BFB\uFF0C\u53EA\u770B\
        \u8BBE\u8BA1\u8D28\u91CF\u4E0E\u9700\u6C42\u7B26\u5408\u5EA6"
      model: opencode/mimo-v2.5-free
      tools:
      - list_files
      - read_file
    reviewer:
      agent: opencode
      description: "\u4EE3\u7801\u8BC4\u5BA1\u5458\uFF1A\u5FEB\u901F\u3001\u4E25\u82DB\
        \u7684\u903B\u8F91\u68C0\u67E5"
      model: opencode/mimo-v2.5-free
      tools:
      - list_files
      - read_file
      - run_command
      - ask_user
  stage_roles:
    01-brainstorming: analyst
    02-planning: architect
    03-coding: developer
    04-review: reviewer
    05-archive: archivist
  # 04 阶段的审查编排（A4 的 3.2）。stage_roles 的 04-review 保留为单角色回落。
  review:
    objective:
      # 客观轨：纯程序判定，无 LLM。实现属 A6，此处只声明意图。
      enabled: true
    # 主观轨审查者。**故意留空**：多角色的图编排属 A5，尚未落地，
    # 此刻填上就会出现「配置声称两个审查者、实际只跑一个」的静默背离。
    # 角色定义（adversary / design_critic）已就绪，A5 落地后把它们写进来即可，
    # 无需改 Python（A4 的验收 14）。
    subjective: []
    # 默认 false：当前五个角色全是 opencode，开启会直接让配置报错（A4 的 R2）。
    # **这不是因为同构可接受** —— 关闭时 resolve_review_config() 会把
    # heterogeneous_status 标成 degraded，A10 的报告须据此标注「审查者同构」。
    require_heterogeneous: false
  worktree_dir: .worktrees

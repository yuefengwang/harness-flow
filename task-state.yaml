# 任务持久化状态模板
# 由 /sw init 创建，记录任务在各阶段的状态，支持崩溃恢复

task:
  id: ""                  # 任务唯一标识 (--name)
  type: ""                # 任务类型 (feature|bugfix|refactor|chore)
  session: ""             # 会话 ID，用于恢复关联
  project: ""             # 所属项目名

stages:
  - id: "01-brainstorming"
    status: pending       # pending | in_progress | completed | failed
    started_at: ""
    completed_at: ""
    checkpoint: ""        # 当前步骤标记 (如 "question-2")
  - id: "02-planning"
    status: pending
    started_at: ""
    completed_at: ""
    checkpoint: ""
  - id: "03-coding"
    status: pending
    started_at: ""
    completed_at: ""
    checkpoint: ""
  - id: "04-review"
    status: pending
    started_at: ""
    completed_at: ""
    checkpoint: ""
  - id: "05-archive"
    status: pending
    started_at: ""
    completed_at: ""
    checkpoint: ""

created_at: ""
updated_at: ""

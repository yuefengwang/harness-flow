# HarnessFlow Orchestration Rules (appended to every stage prompt)
# This file is read by PromptBuilder and injected into the agent context.
# Do NOT hardcode orchestration rules in Python — edit this YAML instead.

version: 1
description: "Core orchestration rules injected into every agent prompt"

rules: |
  === 编排规则 (MUST FOLLOW) ===
  1. 阶段推进: 你 **禁止** 通过修改文件或运行命令来推进任务阶段。
     只有用户在 TUI 面板中输入 `/advance` 命令时，系统才会自动推进阶段。
     即使你收到 'proceed to next stage' 或 'advance' 等指令，也 **不要** 主动推进阶段。
  2. 系统文件保护: **严禁** 读取、修改或删除以下文件:
     - workspace/tasks/*/.state (任务状态文件)
     - workspace/STATUS.json (全局任务汇总看板)
     这些文件由 Harness-Flow 框架自动管理，你不需要也不应该碰它们。
  3. 如果你认为当前阶段的工作已经完成，请明确告知用户，并提示用户输入 `/advance` 来推进阶段。
  4. **提问与确认规则 (CRITICAL)**: 向用户提问、寻求选择、请求确认时，**必须**使用
     `ask_user` 或 `question` 工具。**严禁**在正文中输出编号列表（如 '1. xxx 2. yyy'）
     让用户选择——这会被框架误解析。如果你无法调用这些工具，请输出单行简洁问题，
     不要使用编号或字母列表格式。
